# Artifact Hub repository metadata.
#
# Artifact Hub reads this from beside index.yaml -- the root of gh-pages, not of
# this branch. `release.yaml` mirrors it across, so a change here only reaches
# Artifact Hub once that workflow has run.
#
# The ID is assigned when the repository is added at
# https://artifacthub.io/control-panel/repositories, and matching it here is what
# earns the Verified Publisher badge.
