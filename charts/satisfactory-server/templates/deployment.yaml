{{- include "satisfactory-server.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "satisfactory-server.fullname" . }}
  labels:
    {{- include "satisfactory-server.labels" . | nindent 4 }}
spec:
  # A Satisfactory server is a single process owning a single game world on a
  # ReadWriteOnce volume. Replicas are not a knob.
  replicas: 1
  strategy:
    # Recreate, so the outgoing pod releases the volumes before the new one
    # tries to claim them. RollingUpdate would deadlock on RWO storage.
    type: Recreate
  selector:
    matchLabels:
      {{- include "satisfactory-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "satisfactory-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "satisfactory-server.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        # Creates the directory backing the .steam subPath mount below. The
        # kubelet creates a missing subPath directory owned by root, which
        # would lock the non-root steam user out of its own home. Creating it
        # here instead means it inherits the volume's fsGroup ownership, and
        # the kubelet then bind-mounts the existing directory untouched.
        - name: init-steam-home
          image: {{ include "satisfactory-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c", "mkdir -p /config/steamcache"]
          volumeMounts:
            - name: config
              mountPath: /config
        {{- if .Values.tls.enabled }}
        # Copies the certificate onto the volume rather than mounting the Secret
        # at the path the server reads. Two reasons, both of which have bitten
        # this chart before: a Secret volume is always mounted read-only, and in
        # root mode the entrypoint runs `chown -R` across /config, which would
        # then fail; and mounting below /config/gamefiles makes the kubelet
        # create the intermediate directories as root on a cold volume, locking
        # SteamCMD out of the game directory it is about to install into.
        - name: init-certs
          image: {{ include "satisfactory-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            # Removed before copying, not overwritten: the previous start left
            # them mode 0400, and cp cannot reopen a file it has no write bit
            # on, even as its owner. Every restart after the first would fail.
            - |
              set -e
              certdir={{ include "satisfactory-server.certDir" . }}
              mkdir -p "$certdir"
              for f in cert_chain.pem private_key.pem; do
                rm -f "$certdir/$f"
                cp "/tls/$f" "$certdir/$f"
                chmod 0400 "$certdir/$f"
              done
          volumeMounts:
            - name: config
              mountPath: /config
            {{- if .Values.persistence.gamefiles.enabled }}
            - name: gamefiles
              mountPath: /config/gamefiles
            {{- end }}
            - name: tls
              mountPath: /tls
              readOnly: true
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: satisfactory-server
          image: {{ include "satisfactory-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            # 7777 carries the HTTPS API on TCP and game traffic on UDP. Two
            # entries, one number, two protocols.
            - name: game-tcp
              containerPort: {{ .Values.server.gamePort }}
              protocol: TCP
            - name: game-udp
              containerPort: {{ .Values.server.gamePort }}
              protocol: UDP
            - name: messaging
              containerPort: {{ .Values.server.messagingPort }}
              protocol: TCP
          env:
            {{- include "satisfactory-server.env" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            {{- include "satisfactory-server.probe" (dict "probe" .Values.probes.startup) | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- include "satisfactory-server.probe" (dict "probe" .Values.probes.liveness) | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- include "satisfactory-server.probe" (dict "probe" .Values.probes.readiness) | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
            # SteamCMD's client state, including the app-info cache, kept on
            # the config volume rather than the container filesystem. With a
            # cold cache app_update races the background app-info fetch, and
            # losing that race fails the install with "Missing configuration"
            # and exits 8. Every container start gets a fresh overlay, so
            # without this the race is rerun on every start forever.
            #
            # Mounted at .steam rather than deeper: .steam does not exist in
            # the image, so a deeper mountPath makes the kubelet create the
            # intermediate directories as root, and the non-root steam user
            # can then no longer write its own home.
            - name: config
              mountPath: /home/steam/.steam
              subPath: steamcache
            {{- if .Values.persistence.gamefiles.enabled }}
            # Nested inside /config on purpose: the image expects the game
            # install at this exact path.
            - name: gamefiles
              mountPath: /config/gamefiles
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          {{- if .Values.persistence.config.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "satisfactory-server.configClaimName" . }}
          {{- else }}
          # Ephemeral: saves and backups are lost when the pod is replaced.
          emptyDir: {}
          {{- end }}
        {{- if .Values.persistence.gamefiles.enabled }}
        - name: gamefiles
          {{- if eq .Values.persistence.gamefiles.type "emptyDir" }}
          emptyDir:
            {{- with .Values.persistence.gamefiles.emptyDir.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "satisfactory-server.gamefilesClaimName" . }}
          {{- end }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            defaultMode: 0400
            # Projected under the names the server insists on, so a stock
            # cert-manager Secret needs no preparation.
            items:
              - key: {{ .Values.tls.certKey }}
                path: cert_chain.pem
              - key: {{ .Values.tls.keyKey }}
                path: private_key.pem
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
