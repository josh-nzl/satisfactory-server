{{- if and .Values.persistence.config.enabled (not .Values.persistence.config.existingClaim) }}
{{- /*
This claim holds the saves, so `retain` adds helm.sh/resource-policy: keep and
Helm leaves the claim behind on uninstall unless you delete it yourself.
*/}}
{{- $annotations := deepCopy .Values.persistence.config.annotations }}
{{- if .Values.persistence.config.retain }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "satisfactory-server.configClaimName" . }}
  labels:
    {{- include "satisfactory-server.labels" . | nindent 4 }}
    {{- with .Values.persistence.config.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.config.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size | quote }}
  {{- if .Values.persistence.config.storageClass }}
  {{- if eq "-" .Values.persistence.config.storageClass }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.persistence.config.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
