suite: persistence
tests:
  - it: creates both claims by default
    templates:
      - pvc-config.yaml
      - pvc-gamefiles.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: sizes the claims independently
    templates:
      - pvc-config.yaml
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi

  # The saves claim outlives the release; the game files claim does not.
  - it: retains the config claim but not the gamefiles claim
    templates:
      - pvc-config.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: leaves no dangling annotations key on the gamefiles claim
    templates:
      - pvc-gamefiles.yaml
    asserts:
      - isNull:
          path: metadata.annotations

  - it: retains the gamefiles claim when asked
    set:
      persistence:
        gamefiles:
          retain: true
    templates:
      - pvc-gamefiles.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: merges user annotations with the retention policy
    set:
      persistence:
        config:
          annotations:
            example.com/backup: "daily"
    templates:
      - pvc-config.yaml
    asserts:
      - equal:
          path: metadata.annotations["example.com/backup"]
          value: daily
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: omits storageClassName entirely when unset
    templates:
      - pvc-config.yaml
    asserts:
      - isNull:
          path: spec.storageClassName

  - it: renders an empty storageClassName for the "-" idiom
    set:
      persistence:
        config:
          storageClass: "-"
    templates:
      - pvc-config.yaml
    asserts:
      - equal:
          path: spec.storageClassName
          value: ""

  - it: creates no claims when existing ones are supplied
    set:
      persistence:
        config:
          existingClaim: my-config
        gamefiles:
          existingClaim: my-gamefiles
    templates:
      - pvc-config.yaml
      - pvc-gamefiles.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts the supplied existing claims
    set:
      persistence:
        config:
          existingClaim: my-config
        gamefiles:
          existingClaim: my-gamefiles
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-config
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: my-gamefiles

  # The image expects the game install at this exact path, nested inside /config.
  - it: mounts gamefiles inside the config volume
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[2].mountPath
          value: /config/gamefiles

  # A cold SteamCMD app-info cache races app_update and fails the install with
  # "Missing configuration", exiting 8. The cache lives in the steam user's
  # home, which is on the container filesystem and therefore fresh on every
  # start, so without this the race is rerun on every restart. Verified on a
  # live cluster: two restarts per pod delete before, zero after.
  - it: keeps the SteamCMD cache on the config volume across restarts
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /home/steam/.steam
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].subPath
          value: steamcache

  # The kubelet creates a missing subPath directory owned by root, which locks
  # the non-root steam user out of its own home. Pre-creating it on the volume
  # means it picks up the pod's fsGroup instead.
  - it: pre-creates the SteamCMD cache directory so it is not root-owned
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init-steam-home
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: config
            mountPath: /config

  # Mounting deeper than .steam makes the kubelet create the intermediate
  # directories as root, because .steam does not exist in the image at all.
  - it: mounts the cache at .steam itself, not deeper
    templates:
      - deployment.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          pattern: ^/home/steam/\.steam/.+

  - it: swaps the gamefiles volume for an emptyDir on request
    set:
      persistence:
        gamefiles:
          type: emptyDir
          emptyDir:
            sizeLimit: 30Gi
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].emptyDir.sizeLimit
          value: 30Gi
      - isNull:
          path: spec.template.spec.volumes[1].persistentVolumeClaim

  - it: creates no gamefiles claim when it is an emptyDir
    set:
      persistence:
        gamefiles:
          type: emptyDir
    templates:
      - pvc-gamefiles.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: folds gamefiles into the config volume when disabled
    set:
      persistence:
        gamefiles:
          enabled: false
    templates:
      - deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      # config plus the SteamCMD cache subPath, which shares that volume.
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 2

  - it: falls back to an emptyDir when persistence is disabled entirely
    set:
      persistence:
        config:
          enabled: false
    templates:
      - deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.volumes[0].emptyDir

  # RollingUpdate would deadlock waiting for the outgoing pod to release a
  # ReadWriteOnce volume it only releases once it has terminated.
  - it: uses the Recreate strategy so RWO volumes are released first
    templates:
      - deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.replicas
          value: 1
